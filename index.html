<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-owned label printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EEF0EC; --panel:#FFFFFF; --ink:#16191B; --muted:#5E666B; --line:#D3D7D2;
  --kraft:#A9784C; --kraft-ink:#FFFFFF; --sel:#F3E7DA; --warn:#9A3B1E;
  --label:#FFFFFF; --label-ink:#000000;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151719; --panel:#1F2225; --ink:#ECEEEC; --muted:#9AA2A6; --line:#33383C;
    --kraft:#C99467; --kraft-ink:#1A1208; --sel:#3A2E22; --warn:#F08A62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151719; --panel:#1F2225; --ink:#ECEEEC; --muted:#9AA2A6; --line:#33383C;
  --kraft:#C99467; --kraft-ink:#1A1208; --sel:#3A2E22; --warn:#F08A62;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}

header{padding:20px 20px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;max-width:1280px;margin:0 auto}
h1{margin:0;font-weight:800;font-stretch:72%;font-size:34px;letter-spacing:-.01em;line-height:1}
.source{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.source button{background:none;border:0;padding:0;color:var(--kraft);text-decoration:underline;cursor:pointer;font-size:13px}

main{max-width:1280px;margin:0 auto;padding:12px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-bottom:1px solid var(--line);align-items:center}
select,input[type=search],input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.tabs-select{flex:0 1 220px}

.listwrap{max-height:62vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--sel) 50%,transparent)}
tr.row.on td{background:var(--sel)}
td.serial{font-weight:700;font-stretch:85%;white-space:nowrap}
td.title{color:var(--ink)}
td.dim{color:var(--muted);white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--kraft);margin:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:900px){aside{position:static}}
.block{padding:14px}
.block h2{margin:0 0 10px;font-size:15px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
textarea{width:100%;min-height:64px;resize:vertical;font-size:14px}
.row2{display:flex;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.note.warn{color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--kraft)}
.btn.primary{background:var(--kraft);color:var(--kraft-ink);border-color:var(--kraft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* The label preview: shown at true physical size, sitting on a kraft "shoebox" swatch */
.box{background:var(--kraft);border-radius:8px;padding:22px 12px;display:flex;justify-content:center;align-items:center;overflow:auto;min-height:150px;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 7px)}
.box .lbl{box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.18)}
.previewcap{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}

/* Label rendering shared by preview and print */
.lbl{background:var(--label);color:var(--label-ink);overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  font-family:"Archivo",Arial,Helvetica,sans-serif;flex:none}
.lbl .s{font-weight:800;font-stretch:80%;line-height:1;white-space:nowrap;overflow:hidden;text-align:center}
.lbl svg{display:block;width:100%}
.lbl .t{line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.lbl .m{line-height:1.1;white-space:nowrap;overflow:hidden;text-align:center;font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .count{font-weight:700;font-stretch:85%;font-size:18px;margin-right:auto}
.bar .count span{color:var(--muted);font-weight:400;font-size:14px;font-stretch:100%}

#printArea{display:none}
@media print{
  html,body{background:#fff !important}
  :root{padding:0}
  header,main,.bar{display:none !important}
  #printArea{display:block}
  .lbl{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
<style id="pageStyle"></style>
</head>
<body>
<header>
  <h1>Label printer</h1>
  <div class="source">
    <span id="srcStatus">Loading…</span>
    <button id="reloadBtn" type="button" hidden>Refresh from sheet</button>
    <button id="otherSheetBtn" type="button">Connect sheet</button>
    <label class="btn" style="padding:4px 10px;font-size:13px;cursor:pointer">Open .xlsx / .csv<input id="fileIn" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  </div>
</header>

<main>
  <section class="panel" aria-label="Products">
    <div class="toolbar">
      <select id="tabSel" class="tabs-select" aria-label="Sheet tab"></select>
      <input id="q" type="search" placeholder="Search serial, SKU, title, size" aria-label="Search">
      <button class="btn" id="selAll" type="button">Select shown</button>
      <button class="btn" id="clearSel" type="button">Clear</button>
    </div>
    <div class="listwrap" id="listwrap">
      <div class="empty"><strong>Loading your sheet</strong>Your product tabs will show up here.</div>
    </div>
  </section>

  <aside>
    <div class="panel block">
      <h2>Grab serials fast</h2>
      <textarea id="paste" placeholder="Paste or scan serial codes, e.g. PO21-001, PO21-005 (or a range: PO21-010 to PO21-020)"></textarea>
      <div class="row2" style="margin-top:8px">
        <button class="btn" id="pasteBtn" type="button">Add to print list</button>
        <span class="note" id="pasteNote" style="margin:0"></span>
      </div>
    </div>

    <div class="panel block">
      <h2>Label</h2>
      <div class="field">
        <label for="fmt">Label size</label>
        <select id="fmt">
          <option value="r225x125">2.25 × 1.25 in roll (Dymo, Zebra, Rollo)</option>
          <option value="r2x1">2 × 1 in roll</option>
          <option value="r4x6">4 × 6 in shipping label</option>
          <option value="a5160">Avery 5160 sheet, 30 per page</option>
        </select>
      </div>
      <div class="field">
        <label>Show on label</label>
        <div class="checks">
          <label><input type="checkbox" id="fTitle" checked> Title</label>
          <label><input type="checkbox" id="fSize" checked> Size</label>
          <label><input type="checkbox" id="fCond" checked> Condition</label>
          <label><input type="checkbox" id="fSku"> SKU</label>
          <label><input type="checkbox" id="fPrice"> List price</label>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="copies">Copies of each</label>
        <input id="copies" type="number" min="1" max="20" value="1" style="width:80px">
      </div>
    </div>

    <div class="panel block">
      <h2>Preview</h2>
      <div class="box" id="previewBox"></div>
      <div class="previewcap"><span id="prevCap">Pick an item to preview</span><span>Actual size</span></div>
    </div>
  </aside>
</main>

<div class="bar">
  <div class="in">
    <div class="count" id="count">0 labels <span>selected</span></div>
    <button class="btn" id="pdfBtn" type="button" disabled>Download PDF</button>
    <button class="btn primary" id="printBtn" type="button" disabled>Print labels</button>
  </div>
  <p class="note warn" id="barNote" style="max-width:1280px;margin:6px auto 0" hidden></p>
</div>

<div id="printArea" aria-hidden="true"></div>

<script>
(() => {
"use strict";
// Optional: paste your Apps Script web app URL here so every computer connects automatically.
const DEFAULT_SCRIPT_URL = "https://script.googleusercontent.com/a/macros/evanssneakers.com/echo?user_content_key=AUkAhnQz09cjyHzvMngfrano0WveXulS6QlpD6k_qHJ_uP78igj8A-3XbzuL7bISGrFMsAtQZxcJuyXPxl8RCcznAf2aYIosRPnAFovdsEM9Lr-JK1EGcB8DRE0uDFeHrdkOZpcd_Cy4DvwrVjpUTtTIM3xbRnS4cdbkovNU5WPA42iSyw8hOmHuVm_ZrIFVRpBzfc_2wEVbo0QetpXP66mZgeuC014VQLW04PkXxLeCOwA3DlLpYpK04vrIWsb8g-4YEsvjX_ch3Ev2AfzxQwAaKQP5wFQx-8wA3576arL4ih89YasDMYs&lib=McJ9Uov4gt7S8uvoyH3KVZjbR3iqpjXBQ";
const LS_KEY = "labelprinter:v1";

const FORMATS = {
  r225x125:{w:2.25,h:1.25,sheet:false},
  r2x1:{w:2,h:1,sheet:false},
  r4x6:{w:4,h:6,sheet:false},
  a5160:{w:2.625,h:1,sheet:true,page:[8.5,11],cols:3,rows:10,top:0.5,left:0.1875,gapX:0.125,gapY:0}
};

const $ = id => document.getElementById(id);
const state = {
  scriptUrl: DEFAULT_SCRIPT_URL, sourceName: "", tabs: [], // [{name, items:[...]}]
  tab: "", q: "", selected: new Map() // key -> item
};

/* ---------- storage (per-viewer conveniences only) ---------- */
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function savePrefs(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    scriptUrl: state.scriptUrl, fmt:$("fmt").value, copies:$("copies").value, tab: state.tab,
    f:{t:$("fTitle").checked,s:$("fSize").checked,c:$("fCond").checked,k:$("fSku").checked,p:$("fPrice").checked}
  })); }catch(e){}
}
const prefs = loadPrefs();
if(prefs.scriptUrl) state.scriptUrl = prefs.scriptUrl;
if(prefs.fmt && FORMATS[prefs.fmt]) $("fmt").value = prefs.fmt;
if(prefs.copies) $("copies").value = prefs.copies;
if(prefs.f){ $("fTitle").checked=!!prefs.f.t; $("fSize").checked=!!prefs.f.s; $("fCond").checked=!!prefs.f.c; $("fSku").checked=!!prefs.f.k; $("fPrice").checked=!!prefs.f.p; }

/* ---------- parsing ---------- */
const clean = v => (v===null||v===undefined) ? "" : String(v).replace(/\s+/g," ").trim();
function findCol(headers, names){
  for(const n of names){ const i = headers.findIndex(h => h===n); if(i>=0) return i; }
  for(const n of names){ const i = headers.findIndex(h => h.includes(n)); if(i>=0) return i; }
  return -1;
}
function parseWorkbook(wb){
  const tabs = [];
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:false, defval:""});
    let h = -1;
    for(let i=0;i<Math.min(rows.length,10);i++){
      if(rows[i].some(c => /^\s*serial(\s*(code|#|no\.?|number))?\s*$/i.test(String(c)))){ h=i; break; }
    }
    if(h<0) continue;
    const headers = rows[h].map(c => clean(c).toLowerCase());
    const col = {
      serial: findCol(headers,["serial code","serial"]),
      sku: findCol(headers,["sku","style code"]),
      title: findCol(headers,["product title","title","item","product","name"]),
      size: findCol(headers,["size"]),
      cond: findCol(headers,["quality","condition"]),
      price: findCol(headers,["list price"])
    };
    if(col.serial<0) continue;
    const items = [];
    for(let r=h+1;r<rows.length;r++){
      const row = rows[r]; const serial = clean(row[col.serial]);
      if(!serial || /^serial/i.test(serial)) continue;
      const g = k => col[k]>=0 ? clean(row[col[k]]) : "";
      items.push({key:name+"|"+r, tab:name, serial, sku:g("sku"), title:g("title"), size:g("size"), cond:g("cond"), price:g("price")});
    }
    if(items.length) tabs.push({name, items});
  }
  return tabs;
}

function setData(tabs, sourceLabel){
  state.tabs = tabs;
  // keep only selections that still exist
  const all = new Map(); tabs.forEach(t => t.items.forEach(it => all.set(it.key,it)));
  for(const k of [...state.selected.keys()]){ if(all.has(k)) state.selected.set(k, all.get(k)); else state.selected.delete(k); }
  const sel = $("tabSel"); sel.innerHTML = "";
  const optAll = document.createElement("option"); optAll.value="__all"; optAll.textContent="All tabs"; sel.appendChild(optAll);
  tabs.forEach(t => { const o=document.createElement("option"); o.value=t.name; o.textContent=`${t.name} (${t.items.length})`; sel.appendChild(o); });
  const want = tabs.some(t=>t.name===state.tab) ? state.tab : (prefs.tab && tabs.some(t=>t.name===prefs.tab) ? prefs.tab : ((tabs.find(t=>!/^copy of /i.test(t.name))||tabs[0]||{name:"__all"}).name));
  state.tab = want; sel.value = want;
  $("srcStatus").textContent = sourceLabel;
  renderList(); renderSelection();
}

/* ---------- live data from the Google Apps Script web app ---------- */
async function loadFromScript(){
  if(!state.scriptUrl){ return; }
  $("srcStatus").textContent = "Loading from Google Sheets…";
  $("reloadBtn").hidden = true;
  try{
    const res = await fetch(state.scriptUrl + (state.scriptUrl.includes("?")?"&":"?") + "t=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const tabs = (data.tabs||[]).map(t => ({name:t.name, items:t.items.map((it,i) => ({
      key: t.name+"|"+i, tab: t.name, serial: clean(it.serial), sku: clean(it.sku), title: clean(it.title),
      size: clean(it.size), cond: clean(it.cond), price: clean(it.price)}))})).filter(t => t.items.length);
    const when = new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    setData(tabs, tabs.length ? `${data.title || "Google Sheet"}, loaded ${when}` : "The sheet has no tabs with a Serial Code column.");
  }catch(err){
    const msg = "Couldn't reach your sheet (" + (err.message||err) + "). Check the Apps Script URL with Connect sheet, or open an exported .xlsx file.";
    $("srcStatus").textContent = msg;
    if(!state.tabs.length) $("listwrap").innerHTML = `<div class="empty"><strong>No products loaded</strong>${esc(msg)}</div>`;
  }finally{
    $("reloadBtn").hidden = false;
  }
}

/* ---------- manual file fallback ---------- */
$("fileIn").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:"array"});
    const tabs = parseWorkbook(wb);
    setData(tabs, tabs.length ? `${f.name}, opened from your computer` : `${f.name}: no tabs with a Serial Code column`);
  }catch(err){ $("srcStatus").textContent = `Couldn't read ${f.name}. Export the sheet as .xlsx and try again.`; }
  e.target.value = "";
});

$("otherSheetBtn").addEventListener("click", () => {
  const v = prompt("Paste your Apps Script web app URL (it ends in /exec). See the README for setup.", state.scriptUrl || "");
  if(v===null) return;
  const url = v.trim();
  if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ $("srcStatus").textContent = "That isn't an Apps Script web app URL. It should start with https://script.google.com/"; return; }
  state.scriptUrl = url; savePrefs();
  if(url) loadFromScript(); else $("srcStatus").textContent = "Sheet disconnected. Open an exported .xlsx file, or connect again.";
});
$("reloadBtn").addEventListener("click", loadFromScript);

/* ---------- list ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function visibleItems(){
  const pool = state.tab==="__all" ? state.tabs.flatMap(t=>t.items) : (state.tabs.find(t=>t.name===state.tab)||{items:[]}).items;
  const q = state.q.toLowerCase().trim(); if(!q) return pool;
  const terms = q.split(/\s+/);
  return pool.filter(it => { const hay = (it.serial+" "+it.sku+" "+it.title+" "+it.size+" "+it.cond).toLowerCase(); return terms.every(t=>hay.includes(t)); });
}
function renderList(){
  const wrap = $("listwrap");
  if(!state.tabs.length){ return; }
  const items = visibleItems();
  if(!items.length){ wrap.innerHTML = `<div class="empty"><strong>Nothing matches</strong>Try a different search or tab.</div>`; return; }
  const showTab = state.tab==="__all";
  let html = `<table><thead><tr><th style="width:34px"></th><th>Serial</th><th>Product</th><th>Size</th><th>Condition</th>${showTab?"<th>Tab</th>":""}</tr></thead><tbody>`;
  for(const it of items){
    const on = state.selected.has(it.key);
    html += `<tr class="row${on?" on":""}" data-k="${esc(it.key)}"><td><input type="checkbox" ${on?"checked":""} aria-label="Select ${esc(it.serial)}"></td>
      <td class="serial">${esc(it.serial)}</td><td class="title">${esc(it.title || it.sku || "")}${it.title&&it.sku?`<div class="note" style="margin:0">${esc(it.sku)}</div>`:""}</td>
      <td class="dim">${esc(it.size)}</td><td class="dim">${esc(it.cond)}</td>${showTab?`<td class="dim">${esc(it.tab)}</td>`:""}</tr>`;
  }
  wrap.innerHTML = html + "</tbody></table>";
}
function itemByKey(k){ for(const t of state.tabs){ const f=t.items.find(i=>i.key===k); if(f) return f; } return null; }
$("listwrap").addEventListener("click", e => {
  const tr = e.target.closest("tr.row"); if(!tr) return;
  const k = tr.dataset.k; const it = itemByKey(k); if(!it) return;
  if(state.selected.has(k)) state.selected.delete(k); else state.selected.set(k,it);
  tr.classList.toggle("on", state.selected.has(k));
  tr.querySelector("input").checked = state.selected.has(k);
  renderSelection();
});
$("tabSel").addEventListener("change", e => { state.tab=e.target.value; savePrefs(); renderList(); });
$("q").addEventListener("input", e => { state.q=e.target.value; renderList(); });
$("selAll").addEventListener("click", () => { visibleItems().forEach(it=>state.selected.set(it.key,it)); renderList(); renderSelection(); });
$("clearSel").addEventListener("click", () => { state.selected.clear(); renderList(); renderSelection(); });

/* ---------- paste / scan serials ---------- */
function expandTokens(text){
  const out = [];
  const parts = text.split(/[\n,;\t]+/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){
    const r = p.match(/^(\S*?)(\d+)\s+(?:to|through|–)\s+(\S*?)(\d+)$/i);
    if(r && (r[3]==="" || r[3].toLowerCase()===r[1].toLowerCase())){
      const a=parseInt(r[2],10), b=parseInt(r[4],10), w=r[2].length;
      if(b>=a && b-a<=500){ for(let n=a;n<=b;n++) out.push(r[1]+String(n).padStart(w,"0")); continue; }
    }
    out.push(...p.split(/\s+/));
  }
  return out;
}
$("pasteBtn").addEventListener("click", () => {
  const toks = expandTokens($("paste").value);
  if(!toks.length) return;
  const idx = new Map();
  state.tabs.forEach(t => t.items.forEach(it => { const k=it.serial.toLowerCase(); if(!idx.has(k)) idx.set(k,[]); idx.get(k).push(it); }));
  let added=0; const missing=[];
  for(const t of toks){
    const hits = idx.get(t.toLowerCase());
    if(hits){ hits.forEach(it => { if(!state.selected.has(it.key)){ state.selected.set(it.key,it); added++; } }); }
    else missing.push(t);
  }
  const n = $("pasteNote");
  n.className = "note" + (missing.length ? " warn" : "");
  n.textContent = `Added ${added}.` + (missing.length ? ` Not found: ${missing.slice(0,6).join(", ")}${missing.length>6?"…":""}` : "");
  if(!missing.length) $("paste").value = "";
  renderList(); renderSelection();
});
$("paste").addEventListener("keydown", e => { if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) $("pasteBtn").click(); });

/* ---------- label layout (inches; shared by HTML + PDF) ---------- */
function opts(){ return {title:$("fTitle").checked,size:$("fSize").checked,cond:$("fCond").checked,sku:$("fSku").checked,price:$("fPrice").checked}; }
function metaLine(it,o){
  const bits=[];
  if(o.size && it.size) bits.push("Size " + it.size);
  if(o.cond && it.cond) bits.push(it.cond.toUpperCase());
  if(o.price && it.price) bits.push(/^\$/.test(it.price) ? it.price : "$"+it.price);
  return bits.join("   ");
}
function layout(fmt){
  const f = FORMATS[fmt];
  const u = Math.min(f.h, f.w/1.8);           // scale unit
  return { w:f.w, h:f.h, pad:0.07*u, serialPt:16*u, barH:0.36*u, metaPt:8.5*u, titlePt:7.5*u, gap:0.03*u };
}
function barcodeSVG(value){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  try{ JsBarcode(svg, value, {format:"CODE128", displayValue:false, margin:0, height:100, width:2}); }
  catch(e){ return null; }
  svg.setAttribute("preserveAspectRatio","none");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.style.background="transparent";
  return svg;
}
function labelEl(it, fmt){
  const L = layout(fmt), o = opts();
  const d = document.createElement("div"); d.className="lbl";
  d.style.cssText = `width:${L.w}in;height:${L.h}in;padding:${L.pad}in ${L.pad*1.4}in;gap:${L.gap}in`;
  const s = document.createElement("div"); s.className="s"; s.style.fontSize=L.serialPt+"pt"; s.textContent=it.serial; d.appendChild(s);
  const svg = barcodeSVG(it.serial);
  if(svg){ svg.style.height=L.barH+"in"; d.appendChild(svg); }
  const meta = metaLine(it,o);
  if(meta){ const m=document.createElement("div"); m.className="m"; m.style.fontSize=L.metaPt+"pt"; m.textContent=meta; d.appendChild(m); }
  const sub = [o.title && it.title ? it.title : "", o.sku && it.sku ? it.sku : ""].filter(Boolean).join("   ");
  if(sub){ const t=document.createElement("div"); t.className="t"; t.style.fontSize=L.titlePt+"pt"; t.textContent=sub; d.appendChild(t); }
  return d;
}

/* ---------- selection, preview ---------- */
function labelList(){
  const copies = Math.max(1, Math.min(20, parseInt($("copies").value,10)||1));
  const arr = [];
  for(const it of state.selected.values()) for(let i=0;i<copies;i++) arr.push(it);
  return arr;
}
function renderSelection(){
  const n = labelList().length, items = state.selected.size;
  $("count").innerHTML = `${n} label${n===1?"":"s"} <span>${items===n ? "selected" : `from ${items} item${items===1?"":"s"}`}</span>`;
  $("printBtn").disabled = $("pdfBtn").disabled = n===0;
  const box = $("previewBox"); box.innerHTML="";
  const first = state.selected.values().next().value;
  if(first){ box.appendChild(labelEl(first, $("fmt").value)); $("prevCap").textContent = first.serial; }
  else { $("prevCap").textContent = "Pick an item to preview"; box.innerHTML = `<span style="color:#fff;opacity:.85;font-size:13px">No item selected</span>`; }
}
["fmt","copies","fTitle","fSize","fCond","fSku","fPrice"].forEach(id => $(id).addEventListener("change", () => { savePrefs(); renderSelection(); }));
$("copies").addEventListener("input", renderSelection);

/* ---------- print (browser dialog) ---------- */
function buildPrintArea(){
  const fmt = $("fmt").value, f = FORMATS[fmt], area = $("printArea"); area.innerHTML="";
  const labels = labelList();
  if(!f.sheet){
    $("pageStyle").textContent = `@media print{@page{size:${f.w}in ${f.h}in;margin:0} .pl{width:${f.w}in;height:${f.h}in;page-break-after:always;break-after:page;overflow:hidden} .pl:last-child{page-break-after:auto;break-after:auto}}`;
    labels.forEach(it => { const p=document.createElement("div"); p.className="pl"; p.appendChild(labelEl(it,fmt)); area.appendChild(p); });
  } else {
    const per = f.cols*f.rows;
    $("pageStyle").textContent = `@media print{@page{size:${f.page[0]}in ${f.page[1]}in;margin:0} .sheet{position:relative;width:${f.page[0]}in;height:${f.page[1]}in;page-break-after:always;break-after:page;overflow:hidden} .sheet:last-child{page-break-after:auto;break-after:auto} .sheet .lbl{position:absolute}}`;
    for(let i=0;i<labels.length;i+=per){
      const sh=document.createElement("div"); sh.className="sheet";
      labels.slice(i,i+per).forEach((it,j) => {
        const c=j%f.cols, r=Math.floor(j/f.cols), el=labelEl(it,fmt);
        el.style.left=(f.left + c*(f.w+f.gapX))+"in"; el.style.top=(f.top + r*(f.h+f.gapY))+"in";
        sh.appendChild(el);
      });
      area.appendChild(sh);
    }
  }
}
$("printBtn").addEventListener("click", () => {
  buildPrintArea();
  $("barNote").hidden = false;
  $("barNote").textContent = "Set your printer to 100% scale (Actual size) and pick the matching label size.";
  try{ window.print(); }catch(e){}
});

/* ---------- PDF ---------- */
function barcodePNG(value){
  const c = document.createElement("canvas");
  try{ JsBarcode(c, value, {format:"CODE128", displayValue:false, margin:0, height:160, width:4}); }catch(e){ return null; }
  return c.toDataURL("image/png");
}
function fitText(doc, text, maxW, pt, minPt){
  doc.setFontSize(pt);
  while(pt>minPt && doc.getTextWidth(text)>maxW){ pt-=0.5; doc.setFontSize(pt); }
  if(doc.getTextWidth(text)>maxW){
    let t=text; while(t.length>1 && doc.getTextWidth(t+"…")>maxW) t=t.slice(0,-1);
    return t+"…";
  }
  return text;
}
function drawLabelPDF(doc, it, x, y, fmt){
  const L = layout(fmt), o = opts();
  const padX = L.pad*1.4, cw = L.w - padX*2;
  const meta = metaLine(it,o);
  const sub = [o.title && it.title ? it.title : "", o.sku && it.sku ? it.sku : ""].filter(Boolean).join("   ");
  const ptIn = pt => pt/72;
  // total content height, then center vertically
  const hs = ptIn(L.serialPt)*0.82, hm = meta?ptIn(L.metaPt)*0.9:0, ht = sub?ptIn(L.titlePt)*0.9:0;
  const parts = [hs, L.barH, hm, ht].filter(v=>v>0);
  const total = parts.reduce((a,b)=>a+b,0) + L.gap*2*(parts.length-1);
  let cy = y + Math.max(L.pad, (L.h-total)/2);
  const cx = x + L.w/2;
  doc.setFont("helvetica","bold");
  const s = fitText(doc, it.serial, cw, L.serialPt, 6);
  doc.text(s, cx, cy + hs, {align:"center"}); cy += hs + L.gap*2;
  const png = barcodePNG(it.serial);
  if(png){ doc.addImage(png, "PNG", x+padX, cy, cw, L.barH); }
  cy += L.barH + L.gap*2;
  if(meta){ doc.setFont("helvetica","bold"); const m=fitText(doc, meta, cw, L.metaPt, 5); doc.text(m, cx, cy+hm, {align:"center"}); cy += hm + L.gap*2; }
  if(sub){ doc.setFont("helvetica","normal"); const t=fitText(doc, sub, cw, L.titlePt, 5.5); doc.text(t, cx, cy+ht, {align:"center"}); }
}
function buildPDF(){
  const { jsPDF } = window.jspdf;
  const fmt = $("fmt").value, f = FORMATS[fmt], labels = labelList();
  let doc;
  if(!f.sheet){
    const orient = f.w>f.h ? "landscape" : "portrait";
    doc = new jsPDF({unit:"in", format:[f.w,f.h], orientation:orient});
    labels.forEach((it,i) => { if(i) doc.addPage([f.w,f.h], orient); drawLabelPDF(doc, it, 0, 0, fmt); });
  } else {
    doc = new jsPDF({unit:"in", format:"letter", orientation:"portrait"});
    const per = f.cols*f.rows;
    labels.forEach((it,i) => {
      if(i && i%per===0) doc.addPage("letter","portrait");
      const j=i%per, c=j%f.cols, r=Math.floor(j/f.cols);
      drawLabelPDF(doc, it, f.left + c*(f.w+f.gapX), f.top + r*(f.h+f.gapY), fmt);
    });
  }
  return doc;
}
$("pdfBtn").addEventListener("click", async () => {
  const note = $("barNote"); note.hidden = false;
  let doc; try{ doc = buildPDF(); }catch(e){ note.textContent = "Couldn't build the PDF: " + (e.message||e); return; }
  const blob = doc.output("blob");
  const name = `labels-${new Date().toISOString().slice(0,10)}.pdf`;
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    note.textContent="PDF saved. Print it at 100% scale (Actual size).";
  }catch(e){ note.textContent = "Couldn't save the PDF. Use Print labels instead."; }
});

/* ---------- boot ---------- */
renderSelection();
if(state.scriptUrl){ loadFromScript(); }
else {
  $("srcStatus").textContent = "No sheet connected.";
  $("listwrap").innerHTML = `<div class="empty"><strong>Connect your sheet</strong>Choose Connect sheet and paste your Apps Script URL, or open an .xlsx file (Google Sheets: File → Download → Microsoft Excel).</div>`;
}
})();
</script>
